name: Build downloads

# Every pull request and push to main builds the .deb, .rpm and .tar.gz and
# test-installs them. Pushing a version tag (git tag v1.3.0 && git push origin v1.3.0)
# also publishes a GitHub release with those files attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' gaugedeck.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but gaugedeck.py says $v"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: sh packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gaugedeck
          path: dist/*

  test-deb:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: gaugedeck }
      - run: apt-get update && apt-get install -y ./gaugedeck.deb
      - run: gaugedeck --check && test -f /usr/share/applications/io.github.cyoulater.GaugeDeck.desktop

  test-rpm:
    needs: build
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: gaugedeck }
      - run: dnf install -y ./gaugedeck.rpm
      - run: gaugedeck --check && test -f /usr/share/applications/io.github.cyoulater.GaugeDeck.desktop

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-deb, test-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: gaugedeck }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gaugedeck.deb
            gaugedeck.rpm
            gaugedeck.tar.gz
          generate_release_notes: true
