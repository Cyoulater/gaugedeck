name: Build downloads

# Every pull request and push to main runs the tests, builds the Linux .deb, .rpm and .tar.gz and the
# Windows installer, and test-installs them. Pushing a version tag (git tag v1.3.0 && git push origin v1.3.0)
# also publishes a GitHub release with those files attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' gaugedeck.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but gaugedeck.py says $v"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y rpm python3-gi python3-gi-cairo gir1.2-gtk-4.0
      - run: /usr/bin/python3 -m unittest discover -s tests
      - run: sh packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gaugedeck
          path: dist/*

  test-deb:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: gaugedeck }
      - run: apt-get update && apt-get install -y ./gaugedeck.deb
      - run: gaugedeck --check && test -f /usr/share/applications/io.github.cyoulater.GaugeDeck.desktop

  test-rpm:
    needs: build
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: gaugedeck }
      - run: dnf install -y ./gaugedeck.rpm
      - run: gaugedeck --check && test -f /usr/share/applications/io.github.cyoulater.GaugeDeck.desktop

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-pyinstaller
      - name: Open the deck from source
        run: python packaging/windows/smoke.py
      - name: Build GaugeDeck.exe
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/windows/gaugedeck.spec
      - name: Check GaugeDeck.exe runs
        shell: pwsh
        run: |
          $p = Start-Process dist\GaugeDeck\GaugeDeck.exe -ArgumentList "--sensors" -Wait -PassThru `
                 -RedirectStandardOutput sensors.txt -RedirectStandardError errors.txt
          Get-Content sensors.txt, errors.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path sensors.txt -Pattern "cpu_load")) { exit 1 }
      - name: Build the installer and zip
        shell: pwsh
        run: |
          $v = (Select-String -Path gaugedeck.py -Pattern '^VERSION = "(.*)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$v" packaging\windows\gaugedeck.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\GaugeDeck -DestinationPath dist\GaugeDeck-windows.zip
      - name: Test the installer
        shell: pwsh
        run: |
          Start-Process dist\GaugeDeck-Setup.exe -ArgumentList "/VERYSILENT", "/CURRENTUSER", "/SUPPRESSMSGBOXES" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\GaugeDeck\GaugeDeck.exe"
          if (-not (Test-Path $exe)) { Write-Error "not installed"; exit 1 }
          $p = Start-Process $exe -ArgumentList "--version" -Wait -PassThru -RedirectStandardOutput version.txt
          Get-Content version.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: gaugedeck-windows
          path: |
            dist/GaugeDeck-Setup.exe
            dist/GaugeDeck-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-deb, test-rpm, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gaugedeck.deb
            gaugedeck.rpm
            gaugedeck.tar.gz
            GaugeDeck-Setup.exe
            GaugeDeck-windows.zip
          generate_release_notes: true
